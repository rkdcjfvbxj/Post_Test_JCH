<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시판</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body><main>
<h1>게시글 목록</h1>
<div class="actions"><a class="button" th:href="@{/Post/insert}">게시글 쓰기</a><a th:href="@{/}">메인</a></div>
<p>전체 <span th:text="${pageInfo.totalCount}">0</span>개</p>
<div class="table-wrap"><table>
<thead><tr><th>글번호</th><th>제목</th><th>작성자</th><th>등록일</th></tr></thead>
<tbody>
<tr th:if="${#lists.isEmpty(posts)}"><td colspan="4">등록된 게시글이 없습니다.</td></tr>
<tr th:each="post : ${posts}">
<td th:text="${post.id}"></td>
<td><a th:href="@{/Post/read(PostNo=${post.id})}" th:text="${post.title}"></a></td>
<td th:text="${post.writer}"></td>
<td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
</tr></tbody></table></div>
<nav class="pagination" aria-label="게시글 페이지" th:if="${pageInfo.totalCount > 0}">
<a th:if="${pageInfo.hasPrevious}" th:href="@{/Post/list(page=${pageInfo.startPage - 1})}">이전</a>
<th:block th:each="number : ${#numbers.sequence(pageInfo.startPage, pageInfo.endPage)}">
<strong th:if="${number == pageInfo.page}" th:text="${number}" aria-current="page"></strong>
<a th:if="${number != pageInfo.page}" th:href="@{/Post/list(page=${number})}" th:text="${number}"></a>
</th:block>
<a th:if="${pageInfo.hasNext}" th:href="@{/Post/list(page=${pageInfo.endPage + 1})}">다음</a>
</nav>
</main></body>
</html>
