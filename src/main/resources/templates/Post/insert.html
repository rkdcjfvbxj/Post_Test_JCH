<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시판</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body><main>
<h1>게시글 등록</h1>
<form th:action="@{/Post/insert}" th:object="${post}" method="post">
<label for="title">제목</label>
<input type="text" th:field="*{title}" maxlength="200" required>
<p class="error" th:errors="*{title}"></p>
<label for="writer">작성자</label>
<input type="text" th:field="*{writer}" maxlength="50" required>
<p class="error" th:errors="*{writer}"></p>
<label for="content">내용</label>
<textarea th:field="*{content}" rows="12" maxlength="10000" required></textarea>
<p class="error" th:errors="*{content}"></p>
<button type="submit">등록</button>
</form>
<p><a th:href="@{/Post/list}">목록</a></p>
</main></body>
</html>
