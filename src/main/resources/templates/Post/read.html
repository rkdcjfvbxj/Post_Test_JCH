<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시판</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body><main>
<h1 th:text="${post.title}">게시글 조회</h1>
<p>글번호 <span th:text="${post.id}"></span> · 작성자 <span th:text="${post.writer}"></span></p>
<p>등록일 <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
<p>수정일 <span th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></span></p>
<article class="content" th:text="${post.content}"></article>
<div class="actions"><a class="button" th:href="@{/Post/update(PostNo=${post.id})}">수정</a><a th:href="@{/Post/list}">목록</a></div>
</main></body>
</html>
